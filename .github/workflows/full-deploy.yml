# 静态内容部署到 GitHub Pages 的完整工作流
name: Deploy VitePress & Notify

# 触发条件：推送至 master/main 分支或手动触发
# 补充：原配置保留 pull_request 触发。注意 fork PR 通常没有 pages: write 权限，容易部署失败；
# 如需保留 PR 校验，建议把 deploy 作业加 if: github.event_name != 'pull_request'。
on:
  push:
    branches: ['master', 'main']
  pull_request:
    branches: ['master', 'main']
  workflow_dispatch:

# 全局环境变量
env:
  TZ: Asia/Shanghai

# 权限配置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # 构建作业
  build:
    name: Build Documentation
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # 2. 设置 Node.js
      # 注意：macos-latest 为 ARM64 (M1)，已移除 architecture 强制 x64，
      # 避免 Rosetta 模拟导致的 native 模块兼容性问题
      # 补充：当前 runs-on 是 ubuntu-latest，此处原说明保留；setup-node 已升级到 v7。
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          registry-url: https://registry.npmjs.org

      # 补充：确保 npm 12 生效，否则 allowScripts 不会被强制，下面的版本断言也会失败。
      - name: Enforce npm 12
        run: npm install -g npm@12.2.3

      # 3. 安装依赖
      # 补充：CI 用 npm ci 按 lockfile 可复现安装；如需保留原行为改回 npm install。
      # 补充：npm 12 默认拦截依赖安装脚本（含 ttf2woff2 的 node-gyp rebuild）。
      # 本地用 npm install-scripts approve ttf2woff2 写入 package.json 的 allowScripts 并提交；
      # 不要在 CI 里用 --allow-scripts，项目内使用会报 EALLOWSCRIPTS。
      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4. 验证依赖安装
      # 补充：npm 12 才会强制 allowScripts，低于 12 会让放行名单失效，直接失败。
      - name: Verify installation
        run: |
          npm list --depth=0
          echo "Node version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "Node arch: $(node -p 'process.arch')"
          echo "Runner arch: $(uname -m)"

          NPM_MAJOR=$(npm --version | cut -d. -f1)
          if [ "$NPM_MAJOR" -lt 12 ]; then
            echo "❌ 需要 npm 12+，当前为 $(npm --version)"
            exit 1
          fi

      # 5. 清理构建缓存
      - name: Clean previous build artifacts
        run: rm -rf .vitepress/.temp .vitepress/dist node_modules/.vite

      # 6. 构建文档
      # 关键：加入 --no-experimental-async-hooks 规避 Node 24 + Rolldown 的 async_hooks 崩溃
      # 并加入退出码容错：只要 dist 中有 index.html，即使进程退出码异常也视为成功
      # 补充：原 env 里只写了 max-old-space-size，没写注释里的 flag。
      # 补充：该 flag 在部分 Node 版本上不被支持，改为运行时探测后再追加，避免直接把构建搞挂。
      - name: Build docs
        run: |
          if node --no-experimental-async-hooks -e '' >/dev/null 2>&1; then
            echo "✅ 当前 Node 支持 --no-experimental-async-hooks，已追加"
            export NODE_OPTIONS="$NODE_OPTIONS --no-experimental-async-hooks"
          else
            echo "ℹ️ 当前 Node 不支持 --no-experimental-async-hooks，跳过"
          fi

          set +e
          npm run docs:build
          EXIT_CODE=$?
          set -e

          if [ -f ".vitepress/dist/index.html" ]; then
            if [ $EXIT_CODE -ne 0 ]; then
              echo "⚠️ 构建进程退出码为 $EXIT_CODE，但产物已生成，继续后续流程"
            fi
            exit 0
          else
            echo "❌ 构建失败：未找到 .vitepress/dist/index.html (退出码 $EXIT_CODE)"
            exit $EXIT_CODE
          fi
        env:
          NODE_OPTIONS: '--max-old-space-size=10240'
          NODE_ENV: production

      # 7. 生成部署信息文件（可选，无需可删除整个步骤）
      - name: Add deployment info
        run: |
          mkdir -p .vitepress/dist
          echo "Deployment time: $(date)" >> .vitepress/dist/deployment-info.txt
          echo "Commit: ${{ github.sha }}" >> .vitepress/dist/deployment-info.txt
          echo "Branch: ${{ github.ref_name }}" >> .vitepress/dist/deployment-info.txt
          echo "Workflow: ${{ github.workflow }}" >> .vitepress/dist/deployment-info.txt

      # 8. 验证构建输出
      - name: Verify build output
        run: |
          if [ -d ".vitepress/dist" ]; then
            echo "✅ 构建成功！输出目录: .vitepress/dist"
            echo "总文件数: $(find .vitepress/dist -type f | wc -l)"
          else
            echo "❌ 构建失败: .vitepress/dist 目录不存在"
            exit 1
          fi

      # 9. 上传构建产物 (v7)
      # 修正：upload-artifact@v4/v5 的参数名是 name，不是 artifact-name
      # 补充：v7 同样使用 name，已升级到 actions/upload-artifact@v7。
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: .vitepress/dist
          retention-days: 5

  # 部署作业
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
      contents: write

    # ✅ 补充 outputs：通知作业中的 needs.deploy.outputs.PAGE_URL 依赖此声明
    outputs:
      PAGE_URL: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check workspace
        run: |
          echo "=== Workspace structure ==="
          ls -la

      # 修正：download-artifact@v4/v5 的参数名同样是 name
      # 补充：v8 同样使用 name，已升级到 actions/download-artifact@v8。
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: documentation
          path: ./_site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Validate deployment files
        run: |
          echo "=== 验证下载的构建产物 ==="
          echo "当前目录：$(pwd)"
          echo "_site 目录内容:"
          ls -la ./_site/
          echo "下载的文件："
          find ./_site -type f -name "*.html" | head -5

          if [ ! -f "./_site/index.html" ]; then
            echo "❌ 错误：没有找到 index.html"
            echo "目录结构："
            ls -la ./_site/
            exit 1
          fi

          echo "✅ 找到 index.html，准备部署"

      # 补充：deploy-pages 默认查找名为 github-pages 的 artifact。
      # 重跑会在同一次 workflow run 中留下多个同名 artifact，导致
      # "Multiple artifacts named github-pages were unexpectedly found"。
      # 修复：上传与部署统一用 run_id + run_attempt 生成唯一名字。
      # 补充：upload-pages-artifact@v5 默认排除隐藏文件，加 include-hidden-files 保留 .nojekyll / .well-known 等。
      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare deployment output
        if: success()
        run: |
          echo "DEPLOY_STATUS=success" >> $GITHUB_ENV
          echo "PAGE_URL=${{ steps.deployment.outputs.page_url }}" >> $GITHUB_ENV

      - name: Prepare failure output
        if: failure()
        run: |
          echo "DEPLOY_STATUS=failure" >> $GITHUB_ENV
          echo "PAGE_URL=" >> $GITHUB_ENV

  # 通知作业
  notify:
    name: 📢 Send Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Prepare notification data
        id: prepare-notification
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          COMMIT_SHA_SHORT="${{ github.sha }}"
          COMMIT_SHA_SHORT=${COMMIT_SHA_SHORT:0:7}
          SINGLE_LINE_MSG=$(echo "$COMMIT_MSG" | head -n1 | sed 's/"/\\"/g')

          case "$DEPLOY_RESULT" in
            success)
              EMOJI="✅"
              STATUS_COLOR="#36a64f"
              STATUS_TEXT="成功"
              ;;
            failure)
              EMOJI="❌"
              STATUS_COLOR="#ff0000"
              STATUS_TEXT="失败"
              ;;
            cancelled)
              EMOJI="⚠️"
              STATUS_COLOR="#ffaa00"
              STATUS_TEXT="已取消"
              ;;
            *)
              EMOJI="❓"
              STATUS_COLOR="#808080"
              STATUS_TEXT="未知"
              ;;
          esac

          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "status_color=$STATUS_COLOR" >> $GITHUB_OUTPUT
          echo "status_text=$STATUS_TEXT" >> $GITHUB_OUTPUT
          echo "commit_sha_short=$COMMIT_SHA_SHORT" >> $GITHUB_OUTPUT
          echo "commit_msg=$SINGLE_LINE_MSG" >> $GITHUB_OUTPUT
          echo "deploy_result=$DEPLOY_RESULT" >> $GITHUB_OUTPUT

      - name: Create GitHub Summary
        env:
          EMOJI: ${{ steps.prepare-notification.outputs.emoji }}
          STATUS_TEXT: ${{ steps.prepare-notification.outputs.status_text }}
          DEPLOY_RESULT: ${{ steps.prepare-notification.outputs.deploy_result }}
          COMMIT_SHA_SHORT: ${{ steps.prepare-notification.outputs.commit_sha_short }}
          COMMIT_MSG: ${{ steps.prepare-notification.outputs.commit_msg }}
          PAGE_URL: ${{ needs.deploy.outputs.PAGE_URL }}
        run: |
          {
            echo "## $EMOJI 部署通知"
            echo ""
            echo "**状态**: **$STATUS_TEXT**"
            echo ""
            echo "### 📋 详细信息"
            echo "- **仓库**: \`$GITHUB_REPOSITORY\`"
            echo "- **分支**: \`$GITHUB_REF_NAME\`"
            echo "- **提交**: \`$COMMIT_SHA_SHORT\` - $COMMIT_MSG"
            echo "- **触发者**: ${{ github.triggering_actor || github.actor }}"
            echo "- **工作流**: [$GITHUB_WORKFLOW]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo ""
          } >> $GITHUB_STEP_SUMMARY

          if [ "$DEPLOY_RESULT" = "success" ]; then
            {
              echo "### 🌐 访问地址"
              echo "网站已发布至：[**$PAGE_URL**]($PAGE_URL)"
              echo ""
              echo "🚀 部署完成！"
            } >> $GITHUB_STEP_SUMMARY
          else
            {
              echo "### ❗ 后续操作"
              echo "请检查 **deploy** 作业的日志以排查错误。"
            } >> $GITHUB_STEP_SUMMARY
          fi

      # 补充：原写法把 ${{ }} 直接拼进 shell 单引号，提交信息里的引号/反引号/$() 会破坏 JSON。
      # 改用 jq 从环境变量构造 payload，内容与原版一致。
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATUS_COLOR: ${{ steps.prepare-notification.outputs.status_color }}
          EMOJI: ${{ steps.prepare-notification.outputs.emoji }}
          STATUS_TEXT: ${{ steps.prepare-notification.outputs.status_text }}
          SHA_SHORT: ${{ steps.prepare-notification.outputs.commit_sha_short }}
          PAGE_URL: ${{ needs.deploy.outputs.PAGE_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL 未设置，跳过通知"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg color "$STATUS_COLOR" \
            --arg emoji "$EMOJI" \
            --arg status "$STATUS_TEXT" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$SHA_SHORT" \
            --arg url "$PAGE_URL" \
            --arg result "$DEPLOY_RESULT" '{
              attachments: [{
                color: $color,
                blocks: ([
                  {type: "header", text: {type: "plain_text", text: ($emoji + " VitePress 部署 " + $status)}},
                  {type: "section", fields: [
                    {type: "mrkdwn", text: ("*仓库*\n`" + $repo + "`")},
                    {type: "mrkdwn", text: ("*分支*\n`" + $branch + "`")}
                  ]},
                  {type: "section", fields: [
                    {type: "mrkdwn", text: ("*提交*\n`" + $sha + "`")},
                    {type: "mrkdwn", text: ("*状态*\n" + $status)}
                  ]}
                ] + (if $result == "success" then [{
                  type: "section",
                  text: {type: "mrkdwn", text: ("*🌐 访问地址*\n<" + $url + "|" + $url + ">")}
                }] else [] end))
              }]
            }')
          curl -fsS -X POST -H 'Content-type: application/json' --data "$PAYLOAD" "$SLACK_WEBHOOK_URL"

      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS_COLOR: ${{ steps.prepare-notification.outputs.status_color }}
          EMOJI: ${{ steps.prepare-notification.outputs.emoji }}
          STATUS_TEXT: ${{ steps.prepare-notification.outputs.status_text }}
          COMMIT_MSG: ${{ steps.prepare-notification.outputs.commit_msg }}
          SHA_SHORT: ${{ steps.prepare-notification.outputs.commit_sha_short }}
          PAGE_URL: ${{ needs.deploy.outputs.PAGE_URL }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL 未设置，跳过通知"
            exit 0
          fi
          COLOR_NUM=$(echo "$STATUS_COLOR" | sed 's/#//g')
          COLOR_DEC=$((16#$COLOR_NUM))
          PAYLOAD=$(jq -n \
            --argjson color "$COLOR_DEC" \
            --arg status "$STATUS_TEXT" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg sha "$SHA_SHORT" \
            --arg msg "$COMMIT_MSG" \
            --arg emoji "$EMOJI" \
            --arg actor "${{ github.triggering_actor || github.actor }}" \
            --arg url "$PAGE_URL" \
            --arg result "$DEPLOY_RESULT" \
            --arg workflow "$GITHUB_WORKFLOW" \
            --arg now "$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")" '{
              embeds: [{
                title: ("🚀 VitePress 部署 " + $status),
                description: ("**仓库**: " + $repo + "\n**分支**: `" + $branch + "`"),
                color: $color,
                fields: ([
                  {name: "提交", value: ("`" + $sha + "` - " + $msg), inline: false},
                  {name: "状态", value: ($emoji + " " + $status), inline: true},
                  {name: "触发者", value: $actor, inline: true}
                ] + (if $result == "success" then [{
                  name: "访问地址", value: ("[点击访问](" + $url + ")"), inline: false
                }] else [] end)),
                footer: {text: ("GitHub Actions • " + $workflow)},
                timestamp: $now
              }]
            }')
          curl -fsS -H 'Content-Type: application/json' -X POST --data "$PAYLOAD" "$DISCORD_WEBHOOK_URL"

      # 补充：原 if: failure() 在 notify 作业中永远为 false（notify 自身是成功的），
      # 改用 needs 判断才能真正在部署失败时发邮件。
      - name: Send Email on Failure
        if: needs.deploy.result == 'failure'
        env:
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMOJI: ${{ steps.prepare-notification.outputs.emoji }}
          SHA_SHORT: ${{ steps.prepare-notification.outputs.commit_sha_short }}
        run: |
          if [ -z "$EMAIL_TO" ]; then
            echo "EMAIL_TO 未设置，跳过邮件通知"
            exit 0
          fi
          SUBJECT="$EMOJI VitePress 部署失败 - $GITHUB_REPOSITORY"
          printf '主题：%s\n\n部署工作流失败。\n\n仓库：%s\n分支：%s\n提交：%s\n触发者：%s\n工作流链接：%s/%s/actions/runs/%s\n' \
            "$SUBJECT" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" "$SHA_SHORT" \
            "${{ github.triggering_actor || github.actor }}" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" \
            | mail -s "$SUBJECT" "$EMAIL_TO"

      - name: Final notification status
        env:
          DEPLOY_RESULT: ${{ steps.prepare-notification.outputs.deploy_result }}
        run: |
          echo "========================================"
          echo "通知作业完成"
          echo "部署结果: $DEPLOY_RESULT"
          echo "摘要已生成至 GitHub Actions 界面"
          echo "========================================"
